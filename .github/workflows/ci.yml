name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  vitest:
    name: Vitest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Type check
        run: pnpm typecheck
      - name: Vitest
        run: pnpm test

  playwright:
    name: Playwright geometry
    runs-on: ubuntu-latest
    container:
      # Match pnpm-lock.yaml and the visual snapshot workflow.
      image: mcr.microsoft.com/playwright:v1.61.1-resolute
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Install visual baseline font
        run: sh scripts/install-visual-font.sh
      - name: Playwright geometry + visual assertions
        run: pnpm run test:e2e
      - name: Upload report, traces, and visual diffs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          # test-results/ 含 toHaveScreenshot 失败时的 expected / actual / diff
          name: voyage-playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  success:
    name: Result
    needs: [vitest, playwright]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check status
        run: |
          failures=()

          check() {
            local name="$1" status="$2"
            if [ "$status" != "skipped" ] && [ "$status" != "success" ]; then
              echo "❌ $name → $status"
              failures+=("$name")
            fi
          }

          check "vitest"     "${{ needs.vitest.result }}"
          check "playwright" "${{ needs.playwright.result }}"

          if [ ${#failures[@]} -gt 0 ]; then
            echo ""
            echo "${#failures[@]} job(s) failed."
            exit 1
          fi

          echo "✅ All checks passed!"
