name: Update visual snapshots

# 在与 CI 同构的 Linux Chromium 上生成像素基线，上传为 artifact 供合入。
# 触发: gh workflow run "Update visual snapshots" --ref <branch>
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshots:
    name: Generate chromium-visual baselines
    runs-on: ubuntu-latest
    container:
      # Match pnpm-lock.yaml and the Playwright CI job.
      image: mcr.microsoft.com/playwright:v1.61.1-resolute
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Install visual baseline font
        run: sh scripts/install-visual-font.sh
      - name: Update visual snapshots
        run: pnpm exec playwright test --project=chromium-visual --update-snapshots
      - name: Upload baselines
        uses: actions/upload-artifact@v4
        with:
          name: voyage-visual-snapshots
          path: e2e/visual-regression.spec.ts-snapshots/
          retention-days: 7
