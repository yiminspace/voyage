name: voyage Version Check

on:
  pull_request:
    branches: [main]
    paths:
      - 'packages/voyage/**'

permissions:
  contents: read

jobs:
  check-version:
    name: Check version bump
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compare package.json version against base branch
        run: |
          BASE_VERSION=$(git show "${{ github.event.pull_request.base.sha }}:packages/voyage/package.json" | jq -r .version)
          HEAD_VERSION=$(jq -r .version packages/voyage/package.json)

          echo "Base version (${{ github.event.pull_request.base.ref }}): $BASE_VERSION"
          echo "Head version (this PR):     $HEAD_VERSION"

          if [ "$BASE_VERSION" == "$HEAD_VERSION" ]; then
            echo "::error::本次 PR 改动了 packages/voyage/** 下的文件，但 package.json 的 version 字段未变化（仍为 $HEAD_VERSION）。请 bump 版本号，否则 voyage-publish.yml 会判定「版本未变」并静默跳过发布，改动无法发布到 npm。"
            exit 1
          fi

          echo "✅ 版本已 bump: $BASE_VERSION -> $HEAD_VERSION"
