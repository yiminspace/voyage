name: Version Check

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'index.css'
      - 'tokens.css'
      - 'voyage.css'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'tsconfig.json'
      - 'tsup.config.ts'

permissions:
  contents: read

jobs:
  check-version:
    name: Check version bump
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compare package.json version against base branch
        run: |
          BASE_VERSION=$(git show "${{ github.event.pull_request.base.sha }}:package.json" | jq -r .version)
          HEAD_VERSION=$(jq -r .version package.json)

          echo "Base version (${{ github.event.pull_request.base.ref }}): $BASE_VERSION"
          echo "Head version (this PR):     $HEAD_VERSION"

          if [ "$BASE_VERSION" == "$HEAD_VERSION" ]; then
            echo "::error::本次 PR 改动了 Voyage 的可发布内容，但 package.json 的 version 字段未变化（仍为 $HEAD_VERSION）。请 bump 版本号，否则 publish.yml 会判定版本未递增并跳过发布。"
            exit 1
          fi

          echo "✅ 版本已 bump: $BASE_VERSION -> $HEAD_VERSION"
