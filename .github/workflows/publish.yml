name: Publish

on:
  workflow_dispatch:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  # One publish critical section for main across SHAs, so version checks see
  # a serialized registry state (cancel-in-progress:false queues, never races).
  group: publish-main
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    # Automatic publish only after the same-commit CI workflow succeeds.
    # Manual dispatch still runs version/pack checks and verifies CI for the SHA.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')

    steps:
      - name: Resolve publish SHA
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            SHA="${{ github.event.workflow_run.head_sha }}"
          else
            SHA="${{ github.sha }}"
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Publish SHA: $SHA"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.meta.outputs.sha }}
          # A skipped publish may repair a tag only on the commit that introduced
          # the published version, so inspect its first parent below.
          fetch-depth: 2

      - name: Verify branch is main
        run: |
          REF="${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref_name }}"
          echo "Head ref: $REF"
          if [ "$REF" != "main" ]; then
            echo "::error::Publish only runs for main (got $REF)"
            exit 1
          fi

      - name: Verify CI Result for this SHA
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHA="${{ steps.meta.outputs.sha }}"
          # Require a completed successful CI run for this exact commit.
          # Fail closed when CI is missing, still running, cancelled, or failed.
          RUN_JSON=$(gh api \
            "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?head_sha=${SHA}&event=push&per_page=20")
          CONCLUSION=$(echo "$RUN_JSON" | jq -r '
            [.workflow_runs[] | select(.status == "completed")]
            | sort_by(.updated_at) | reverse
            | .[0].conclusion // empty
          ')
          if [ -z "$CONCLUSION" ]; then
            echo "::error::No completed CI run found for ${SHA}; refusing to publish"
            exit 1
          fi
          if [ "$CONCLUSION" != "success" ]; then
            echo "::error::CI Result for ${SHA} is '${CONCLUSION}', not success; refusing to publish"
            exit 1
          fi
          echo "CI succeeded for ${SHA}"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Update npm for trusted publishing
        run: npm install -g npm@latest

      - name: Decide whether to publish
        id: check
        run: node scripts/publish-decision.mjs decide --from-registry

      - name: Install dependencies
        if: steps.check.outputs.should_publish == 'true'
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        if: steps.check.outputs.should_publish == 'true'
        run: pnpm typecheck

      - name: Build
        if: steps.check.outputs.should_publish == 'true'
        run: pnpm build

      - name: Verify pack contents
        if: steps.check.outputs.should_publish == 'true'
        run: node scripts/check-pack-contents.mjs --pack

      - name: Publish to npm
        if: steps.check.outputs.should_publish == 'true'
        run: pnpm publish --access public --provenance --no-git-checks

      - name: Ensure Git tag
        # Also runs on skip so a successful npm publish + failed tag can be healed
        # on rerun without republishing (never move an existing tag).
        if: steps.check.outputs.should_publish == 'true' || steps.check.outputs.decision == 'skip'
        id: tag
        env:
          VERSION: ${{ steps.check.outputs.version }}
          PUBLISH_SHA: ${{ steps.meta.outputs.sha }}
          SHOULD_PUBLISH: ${{ steps.check.outputs.should_publish }}
        run: |
          set -euo pipefail
          TAG="voyage-v${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Annotated tags: resolve to the peeled commit, never move an existing tag.
          if git ls-remote --tags origin "refs/tags/${TAG}" | grep -q .; then
            git fetch --no-tags origin "refs/tags/${TAG}:refs/tags/${TAG}"
            EXISTING=$(git rev-list -n 1 "${TAG}")
            TAG_VERSION=$(git show "${TAG}:package.json" | node -e '
              let text = "";
              process.stdin.on("data", (chunk) => { text += chunk; });
              process.stdin.on("end", () => process.stdout.write(JSON.parse(text).version));
            ')
            if [ "$TAG_VERSION" != "$VERSION" ]; then
              echo "::error::Tag ${TAG} contains package version ${TAG_VERSION}, expected ${VERSION}; refusing to use it"
              exit 1
            fi
            if [ "$SHOULD_PUBLISH" = "true" ] && [ "$EXISTING" != "$PUBLISH_SHA" ]; then
              echo "::error::Tag ${TAG} already exists at ${EXISTING}, refusing to move it (wanted ${PUBLISH_SHA})"
              exit 1
            fi
            echo "Tag ${TAG} already points at published version ${VERSION} (${EXISTING}); leaving it unchanged"
            echo "tag_action=unchanged" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$SHOULD_PUBLISH" != "true" ]; then
            # npm already has this version. Only heal a missing tag when this
            # exact SHA introduced the version; a later same-version main
            # commit must never be tagged as the release.
            if ! git rev-parse "${PUBLISH_SHA}^" >/dev/null 2>&1; then
              echo "::error::Tag ${TAG} is missing and ${PUBLISH_SHA} has no parent; refusing to infer a release commit"
              exit 1
            fi
            PARENT_VERSION=$(git show "${PUBLISH_SHA}^:package.json" | node -e '
              let text = "";
              process.stdin.on("data", (chunk) => { text += chunk; });
              process.stdin.on("end", () => process.stdout.write(JSON.parse(text).version));
            ')
            if [ "$PARENT_VERSION" = "$VERSION" ]; then
              echo "::error::Tag ${TAG} is missing, but ${PUBLISH_SHA} did not introduce version ${VERSION}; refusing to tag a later same-version commit"
              exit 1
            fi
            echo "Healing missing tag ${TAG} for version-introducing commit ${PUBLISH_SHA}"
          fi

          git tag -a "${TAG}" -m "Release @yiminlab/voyage v${VERSION}" "${PUBLISH_SHA}"
          git push origin "refs/tags/${TAG}"
          echo "tag_action=created" >> "$GITHUB_OUTPUT"

      - name: Summary (published)
        if: steps.check.outputs.should_publish == 'true'
        run: |
          echo "## Published @yiminlab/voyage v${{ steps.check.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`${{ steps.meta.outputs.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- NPM: https://www.npmjs.com/package/@yiminlab/voyage" >> "$GITHUB_STEP_SUMMARY"
          echo "- Tag: \`voyage-v${{ steps.check.outputs.version }}\` (${{ steps.tag.outputs.tag_action }})" >> "$GITHUB_STEP_SUMMARY"

      - name: Summary (skipped)
        if: steps.check.outputs.decision == 'skip'
        run: |
          echo "## Skipped npm publish" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Version \`${{ steps.check.outputs.version }}\` is already on npm." >> "$GITHUB_STEP_SUMMARY"
          echo "Tag \`voyage-v${{ steps.check.outputs.version }}\`: ${{ steps.tag.outputs.tag_action }} (commit \`${{ steps.meta.outputs.sha }}\`)." >> "$GITHUB_STEP_SUMMARY"
